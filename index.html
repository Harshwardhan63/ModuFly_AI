<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d100f">
  <meta name="description" content="ModuFly AI dashboard and batch traceability">
  <title>ModuFly AI — Batch Traceability</title>
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    .batch-mini{gap:12px;align-items:center;flex-wrap:wrap}
    .batch-mini-info{display:flex;align-items:center;gap:10px;flex:1;min-width:160px;flex-wrap:wrap}
    .batch-qr-open{padding:7px 11px;font-size:11px;white-space:nowrap}
    .scan-page{min-height:100vh;padding:clamp(20px,5vw,64px);background:#0d100f;color:#edf4e9;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .scan-wrap{max-width:820px;margin:0 auto}
    .scan-brand{color:#c5fb70;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
    .scan-page h1{font-size:clamp(26px,5vw,42px);font-weight:500;margin:12px 0}
    .scan-page .scan-intro{color:#aab7a4;line-height:1.6;margin-bottom:26px}
    .scan-card{background:#151b17;border:1px solid #2a382d;border-radius:14px;padding:clamp(14px,3vw,26px);overflow:hidden}
    .scan-table{width:100%;border-collapse:collapse;table-layout:fixed}
    .scan-table th,.scan-table td{text-align:left;padding:13px 12px;border-bottom:1px solid #29352c;vertical-align:top;overflow-wrap:anywhere;line-height:1.5}
    .scan-table th{width:36%;font-size:12px;color:#c5fb70;font-weight:500}
    .scan-table td{font-size:13px;color:#eef3e9}
    .scan-table tr:last-child th,.scan-table tr:last-child td{border-bottom:0}
    .scan-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
    .scan-actions a,.scan-actions button{display:inline-block;padding:11px 15px;border-radius:7px;border:1px solid #3b4c3d;color:#edf4e9;background:#19231a;text-decoration:none;font:inherit;font-size:13px;cursor:pointer}
    .scan-actions a:first-child{background:#c5fb70;color:#14200f;border-color:#c5fb70}
    .scan-error{padding:16px;border:1px solid #784d43;border-radius:8px;color:#ffd3c8;background:#271916}
    @media(max-width:480px){.scan-table th{width:39%;padding:11px 8px;font-size:11px}.scan-table td{padding:11px 8px;font-size:12px}}
    @media print{.scan-page{background:white;color:#111;padding:0}.scan-card{background:white;border-color:#bbb}.scan-table th,.scan-table td{color:#111;border-color:#ddd}.scan-table th{color:#222}.scan-actions{display:none}.scan-page .scan-intro{color:#444}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    (function () {
      const prefix = '#batchqr=';
      if (location.hash.startsWith(prefix)) {
        const root = document.getElementById('root');
        const esc = value => String(value ?? '—').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
        try {
          const encoded = decodeURIComponent(location.hash.slice(prefix.length));
          const batch = JSON.parse(decodeURIComponent(escape(atob(encoded))));
          if (batch.app !== 'ModuFly AI' || batch.record_type !== 'batch' || !batch.id) throw new Error('This QR code does not contain a valid ModuFly AI batch.');
          const rows = [
            ['Batch ID', batch.id], ['Batch name / feedstock', batch.name],
            ['Assigned module', 'Module 0' + batch.module], ['Waste input', `${batch.waste_kg ?? '—'} kg`],
            ['Lifecycle stage', batch.stage],
            ['Created at', batch.created_at ? new Date(batch.created_at).toLocaleString() : '—'],
            ['Source', batch.source]
          ];
          root.innerHTML = `<main class="scan-page"><div class="scan-wrap"><div class="scan-brand">ModuFly AI · Traceability</div><h1>Batch details</h1><p class="scan-intro">This table shows the information encoded in the batch QR code. Each detail is listed in its own row for quick checking.</p><section class="scan-card"><table class="scan-table"><tbody>${rows.map(([label,value]) => `<tr><th scope="row">${esc(label)}</th><td>${esc(value)}</td></tr>`).join('')}</tbody></table></section><div class="scan-actions"><a href="${esc(location.pathname + location.search)}">Open ModuFly AI</a><button type="button" onclick="window.print()">Print details</button></div></div></main>`;
        } catch (error) {
          root.innerHTML = `<main class="scan-page"><div class="scan-wrap"><div class="scan-brand">ModuFly AI · Traceability</div><h1>Unable to read batch</h1><p class="scan-error">${esc(error.message || 'The QR code data is invalid.')}</p><div class="scan-actions"><a href="${esc(location.pathname + location.search)}">Open ModuFly AI</a></div></div></main>`;
        }
      } else {
        const app = document.createElement('script');
        app.src = 'assets/app.js';
        document.body.appendChild(app);
      }
    })();
  </script>
</body>
</html>
